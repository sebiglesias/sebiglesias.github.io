<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="color-scheme" content="light dark">
	<title>404 — Page not found · Sebastian Iglesias</title>
	<link rel="manifest" href="/manifest.json">
	<link rel="icon" type="image/x-icon" href="/img/favicon.ico">
	<link rel="stylesheet" href="/css/bootstrap-replacement.css">
	<link rel="stylesheet" href="/css/layout.css">
	<link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
	<noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"></noscript>
	<link rel="stylesheet" href="/css/theme.css">
	<script>!function(){var t=localStorage.getItem('theme-preference')||'system';document.documentElement.dataset.theme=t==='system'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;}();</script>
	<style>
		html, body { height: 100%; }
		body {
			font-family: 'Montserrat', sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 1rem;
			text-align: center;
		}
		.error-code { font-size: 6rem; font-weight: 700; line-height: 1; margin: 0; color: #005f73; }
		.error-title { font-size: 1.5rem; margin: 0.5rem 0 1.5rem; }
		.error-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
		.error-links a {
			padding: 0.6rem 1.5rem;
			border-radius: 6px;
			text-decoration: none;
			font-weight: 600;
			background: #005f73;
			color: #fff;
			transition: background 0.15s ease;
		}
		.error-links a:hover { background: #0a4a5c; }
		html[data-theme="dark"] .error-code { color: #22d3ee; }
		html[data-theme="dark"] .error-links a { background: #22d3ee; color: #0d1117; }
		html[data-theme="dark"] .error-links a:hover { background: #67e8f9; }
		.lang-404 { margin-top: 2rem; font-size: 0.85rem; }
		.lang-404 a { color: #005f73; }
		html[data-theme="dark"] .lang-404 a { color: #22d3ee; }
	</style>
</head>
<body>
	<div>
		<p class="error-code">404</p>
		<h1 class="error-title">Page not found</h1>
		<p>The page you're looking for doesn't exist or has moved.</p>
		<div class="error-links">
			<a href="/">Go home</a>
			<a href="mailto:hi@sebiglesias.com.ar">Contact me</a>
		</div>
		<p class="lang-404"><a href="/es/" lang="es">Ver en español</a></p>
	</div>
</body>
</html>
